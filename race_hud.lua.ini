local playerCar = ac.getCar(0)
local inRace = false
local isPreparing = false
local opponentIdx = -1

-- Механика SP Battle и таймера (3 минуты = 180 сек)
local raceScore = 0          -- От -1000 (поражение) до +1000 (победа)
local maxScore = 1000
local maxRaceTime = 180.0    -- Жесткий лимит 3 минуты
local raceTimer = 180.0
local pointsPerSec = 10.0    -- 100 сек чистого отрыва (> 10м) для досрочной победы

-- Уведомления и итоги
local resultTimer = 0
local resultText = ""
local resultColor = rgbm(1, 0.85, 0.2, 1)

local overtakeTimer = 0
local overtakeText = ""
local overtakeColor = rgbm(1, 1, 1, 1)

-- Оптимизация поиска игроков (кэш на 0.5 сек для высокого FPS)
local searchTimer = 0
local cachedNearestIdx = -1
local cachedNearestDist = 99999

local function isTrafficCar(carIndex)
    local name = ac.getDriverName(carIndex)
    if not name then return true end
    return string.find(string.lower(name), "traffic") ~= nil
end

local function findNearestPlayer()
    local minDist = 99999
    local nearestIdx = -1
    local totalCars = ac.getSim().carsCount

    for i = 1, totalCars - 1 do
        local car = ac.getCar(i)
        if car and car.isConnected and not isTrafficCar(i) then
            local dist = playerCar.position:distance(car.position)
            if dist < minDist then
                minDist = dist
                nearestIdx = i
            end
        end
    end
    return nearestIdx, minDist
end

local function finishDuel(text, color)
    inRace = false
    isPreparing = false
    resultText = text
    resultColor = color
    resultTimer = 5.0
    opponentIdx = -1
    overtakeTimer = 0
end

-- Обработка сообщений чата RaceChallengePlugin
local function handleServerMessage(message)
    if not message or message == "" then return end
    local lowerMsg = string.lower(message)

    -- 1. Обратный отсчет
    if string.find(lowerMsg, "ready...") or string.find(lowerMsg, "set...") then
        local targetIdx, dist = findNearestPlayer()
        if targetIdx ~= -1 and dist <= 400 then
            isPreparing = true
            opponentIdx = targetIdx
            resultTimer = 0
        end
        return
    end

    -- 2. Старт гонки (Go!)
    if lowerMsg == "go!" or string.find(lowerMsg, "go!") then
        local targetIdx, dist = findNearestPlayer()
        if targetIdx ~= -1 and dist <= 400 then
            isPreparing = false
            inRace = true
            opponentIdx = targetIdx
            raceScore = 0
            raceTimer = maxRaceTime
            resultTimer = 0
            overtakeTimer = 0
        end
        return
    end

    -- 3. Событие обгона ("Пилот1 has overtaken Пилот2")
    if inRace and string.find(lowerMsg, "has overtaken") then
        local myName = string.lower(ac.getDriverName(0) or "")
        local oppName = opponentIdx ~= -1 and string.lower(ac.getDriverName(opponentIdx) or "") or ""
        local overtakenPos = string.find(lowerMsg, "has overtaken")

        if myName ~= "" and oppName ~= "" and overtakenPos then
            local myPos = string.find(lowerMsg, myName, 1, true)
            local oppPos = string.find(lowerMsg, oppName, 1, true)

            if myPos and oppPos then
                if myPos < overtakenPos then
                    overtakeText = "ВЫ ОБОГНАЛИ СОПЕРНИКА!"
                    overtakeColor = rgbm(0.15, 0.9, 1.0, 1)
                    overtakeTimer = 3.5
                elseif oppPos < overtakenPos then
                    overtakeText = "ВАС ОБОГНАЛИ!"
                    overtakeColor = rgbm(1.0, 0.25, 0.2, 1)
                    overtakeTimer = 3.5
                end
            end
        end
        return
    end

    -- 4. Завершение гонки серверным плагином
    if inRace and string.find(lowerMsg, "in a race") and (string.find(lowerMsg, "just been") or string.find(lowerMsg, "just beat")) then
        local myName = string.lower(ac.getDriverName(0) or "")
        local oppName = opponentIdx ~= -1 and string.lower(ac.getDriverName(opponentIdx) or "") or ""

        if (myName ~= "" and string.find(lowerMsg, myName, 1, true)) or (oppName ~= "" and string.find(lowerMsg, oppName, 1, true)) then
            if raceScore > 0 then
                finishDuel("SP BATTLE: ПОБЕДА!", rgbm(0.15, 0.9, 1.0, 1))
            elseif raceScore < 0 then
                finishDuel("SP BATTLE: ПОРАЖЕНИЕ", rgbm(1.0, 0.25, 0.2, 1))
            else
                finishDuel("SP BATTLE: НИЧЬЯ", rgbm(1.0, 0.85, 0.2, 1))
            end
        end
    end
end

ac.onChatMessage(function(message, senderCarIndex, senderSessionId)
    handleServerMessage(message)
end)

if ac.onSystemMessage then
    ac.onSystemMessage(function(message)
        handleServerMessage(message)
    end)
end

-- Основной цикл физики и таймеров
function script.update(dt)
    if resultTimer > 0 then resultTimer = resultTimer - dt end
    if overtakeTimer > 0 then overtakeTimer = overtakeTimer - dt end

    -- Обновляем кэш ближайшего игрока раз в 0.5 сек
    searchTimer = searchTimer - dt
    if searchTimer <= 0 then
        searchTimer = 0.5
        cachedNearestIdx, cachedNearestDist = findNearestPlayer()
    end

    if not inRace then return end

    -- Обратный отсчет 3 минут
    raceTimer = raceTimer - dt
    if raceTimer <= 0 then
        if raceScore > 0 then
            finishDuel("ВРЕМЯ ВЫШЛО: ПОБЕДА ПО ОЧКАМ!", rgbm(0.15, 0.9, 1.0, 1))
        elseif raceScore < 0 then
            finishDuel("ВРЕМЯ ВЫШЛО: ПОРАЖЕНИЕ ПО ОЧКАМ", rgbm(1.0, 0.25, 0.2, 1))
        else
            finishDuel("ВРЕМЯ ВЫШЛО: НИЧЬЯ", rgbm(1.0, 0.85, 0.2, 1))
        end
        return
    end

    local oppCar = ac.getCar(opponentIdx)
    if not oppCar or not oppCar.isConnected then
        finishDuel("ДУЭЛЬ ПРЕРВАНА (СОПЕРНИК ВЫШЕЛ)", rgbm(0.8, 0.8, 0.8, 1))
        return
    end

    local distance = playerCar.position:distance(oppCar.position)

    -- Если разъехались слишком далеко (более 600 м) — прерываем дуэль
    if distance > 600 then
        finishDuel("ДУЭЛЬ ПРЕРВАНА (СЛИШКОМ ДАЛЕКО)", rgbm(0.8, 0.8, 0.8, 1))
        return
    end

    -- ГЛАВНОЕ ПРАВИЛО: Очки идут ТОЛЬКО если отрыв БОЛЬШЕ 10 метров
    if distance > 10.0 then
        local toOpponent = oppCar.position - playerCar.position
        local forwardDot = playerCar.look:dot(toOpponent)

        if forwardDot < 0 then
            raceScore = raceScore + (pointsPerSec * dt)
        else
            raceScore = raceScore - (pointsPerSec * dt)
        end
    end

    -- Проверка досрочной победы по шкале SP
    if raceScore >= maxScore then
        finishDuel("SP BATTLE: ПОБЕДА!", rgbm(0.15, 0.9, 1.0, 1))
    elseif raceScore <= -maxScore then
        finishDuel("SP BATTLE: ПОРАЖЕНИЕ", rgbm(1.0, 0.25, 0.2, 1))
    end
end
-- Отрисовка интерфейса в стиле Tokyo Xtreme Racer
function script.drawUI()
    local screenSize = ac.getUI().windowSize
    local boxWidth = 460
    local posX = (screenSize.x - boxWidth) / 2
    local posY = 30

    -- 1. Баннер результата финиша
    if resultTimer > 0 then
        ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + 56), rgbm(0.05, 0.06, 0.1, 0.92), 4)
        ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + 56), resultColor, 4, 2)
        ui.setCursor(vec2(posX + 25, posY + 18))
        ui.textColored(resultText, resultColor)
        return
    end

    -- 2. Активная дуэль в стиле TXR
    if inRace and opponentIdx ~= -1 then
        local oppCar = ac.getCar(opponentIdx)
        local myName = ac.getDriverName(0) or "YOU"
        local oppName = ac.getDriverName(opponentIdx) or "RIVAL"
        local distance = playerCar.position:distance(oppCar.position)
        local isScoringActive = distance > 10.0

        local panelHeight = overtakeTimer > 0 and 126 or 96

        ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + panelHeight), rgbm(0.04, 0.05, 0.08, 0.90), 4)
        local borderColor = isScoringActive and rgbm(0.15, 0.85, 1.0, 0.95) or rgbm(0.35, 0.4, 0.5, 0.65)
        ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + panelHeight), borderColor, 4, 2)

        -- Верхняя строка: Имя игрока, Таймер 03:00, Имя соперника
        ui.setCursor(vec2(posX + 14, posY + 10))
        ui.textColored("1P: " .. string.sub(myName, 1, 16), rgbm(0.2, 0.9, 1.0, 1))

        local mins = math.floor(math.max(0, raceTimer) / 60)
        local secs = math.floor(math.max(0, raceTimer) % 60)
        local timerStr = string.format("%02d:%02d", mins, secs)
        ui.setCursor(vec2(posX + (boxWidth / 2) - 22, posY + 10))
        ui.textColored(timerStr, raceTimer <= 30 and rgbm(1.0, 0.3, 0.2, 1) or rgbm(1.0, 0.9, 0.2, 1))

        ui.setCursor(vec2(posX + boxWidth - 155, posY + 10))
        ui.textColored("RIVAL: " .. string.sub(oppName, 1, 14), rgbm(1.0, 0.35, 0.25, 1))

        -- Встречная шкала Spirit Points (TXR Style)
        local barX = posX + 14
        local barY = posY + 34
        local barW = boxWidth - 28
        local barH = 18

        ui.drawRectFilled(vec2(barX, barY), vec2(barX + barW, barY + barH), rgbm(0.12, 0.13, 0.18, 1), 2)

        local playerShare = 0.5 + (raceScore / (maxScore * 2))
        playerShare = math.max(0.0, math.min(1.0, playerShare))
        local splitX = barX + (barW * playerShare)

        if splitX > barX then
            ui.drawRectFilledMultiColor(
                vec2(barX, barY),
                vec2(splitX, barY + barH),
                rgbm(0.05, 0.45, 0.95, 1),
                rgbm(0.15, 0.95, 1.0, 1),
                rgbm(0.15, 0.95, 1.0, 1),
                rgbm(0.05, 0.45, 0.95, 1)
            )
        end

        if splitX < barX + barW then
            ui.drawRectFilledMultiColor(
                vec2(splitX, barY),
                vec2(barX + barW, barY + barH),
                rgbm(1.0, 0.45, 0.1, 1),
                rgbm(0.85, 0.1, 0.15, 1),
                rgbm(0.85, 0.1, 0.15, 1),
                rgbm(1.0, 0.45, 0.1, 1)
            )
        end

        ui.drawLine(vec2(splitX, barY - 2), vec2(splitX, barY + barH + 2), rgbm(1, 1, 1, 1), 2)
        ui.drawLine(vec2(barX + barW / 2, barY), vec2(barX + barW / 2, barY + barH), rgbm(1, 1, 1, 0.35), 1)

        -- Нижняя строка: Дистанция, статус отрыва (> 10м) и очки
        ui.setCursor(vec2(posX + 14, posY + 62))
        if isScoringActive then
            ui.textColored(string.format("ДИСТАНЦИЯ: %.1f м [ОТРЫВ > 10м: ОЧКИ ИДУТ]", distance), rgbm(0.2, 1.0, 0.6, 1))
        else
            ui.textColored(string.format("ДИСТАНЦИЯ: %.1f м [РЯДОМ <= 10м: ПАУЗА]", distance), rgbm(0.65, 0.65, 0.7, 1))
        end

        local scoreSign = raceScore > 0 and "+" or ""
        ui.setCursor(vec2(posX + boxWidth - 115, posY + 62))
        ui.textColored(string.format("SP: %s%d", scoreSign, math.floor(raceScore)), raceScore >= 0 and rgbm(0.2, 0.9, 1.0, 1) or rgbm(1.0, 0.35, 0.25, 1))

        -- 4. Баннер при обгоне ("has overtaken")
        if overtakeTimer > 0 then
            local bannerY = posY + 88
            ui.drawRectFilled(vec2(posX + 14, bannerY), vec2(posX + boxWidth - 14, bannerY + 28), rgbm(0.1, 0.12, 0.18, 0.95), 3)
            ui.drawRect(vec2(posX + 14, bannerY), vec2(posX + boxWidth - 14, bannerY + 28), overtakeColor, 3, 1.5)
            ui.setCursor(vec2(posX + 24, bannerY + 6))
            ui.textColored(overtakeText, overtakeColor)
        end
        return
    end

    -- 3. Режим ожидания
    ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + 56), rgbm(0.04, 0.05, 0.08, 0.85), 4)
    ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + 56), isPreparing and rgbm(1.0, 0.8, 0.1, 0.95) or rgbm(0.2, 0.65, 0.85, 0.55), 4, isPreparing and 2 or 1)

    if isPreparing and opponentIdx ~= -1 then
        local oppName = ac.getDriverName(opponentIdx) or "RIVAL"
        ui.setCursor(vec2(posX + 15, posY + 9))
        ui.textColored("SP BATTLE: ПРИГОТОВЬТЕСЬ! RIVAL: " .. oppName, rgbm(1.0, 0.85, 0.2, 1))
        ui.setCursor(vec2(posX + 15, posY + 30))
        ui.text("Ожидание сигнала GO! (Отрыв > 10 м | Лимит: 3:00)")
    elseif cachedNearestIdx ~= -1 and cachedNearestDist <= 500 then
        local driverName = ac.getDriverName(cachedNearestIdx) or "RIVAL"
        ui.setCursor(vec2(posX + 15, posY + 9))
        ui.textColored("RIVAL РЯДОМ: " .. driverName, rgbm(0.2, 0.9, 1.0, 1))
        ui.setCursor(vec2(posX + 15, posY + 30))
        ui.text(string.format("Дистанция: %.1f м — моргните дальним 3 раза для вызова", cachedNearestDist))
    else
        ui.setCursor(vec2(posX + 15, posY + 9))
        ui.textColored("TOKYO XTREME SP BATTLE — ПОИСК СОПЕРНИКА", rgbm(0.6, 0.8, 0.95, 1))
        ui.setCursor(vec2(posX + 15, posY + 30))
        ui.text(cachedNearestIdx ~= -1 and string.format("Ближайший игрок: %.0f м", cachedNearestDist) or "Других игроков на трассе нет")
    end
end
