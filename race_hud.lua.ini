local playerCar = ac.getCar(0)
local opponentIndex = -1
local playerPoints = 1000
local inRace = false
local debugText = "HUD загружен. Ожидание игрока..."

ac.onChatMessage(function(message, senderCarIndex, senderSessionId)
    -- Убираем проверку senderCarIndex, так как плагины могут слать от имени сервера (255 или -1)
    local lowerMsg = string.lower(message)
    debugText = "Чат: " .. message

    if string.find(lowerMsg, "challenge") and (string.find(lowerMsg, "started") or string.find(lowerMsg, "accepted") or string.find(lowerMsg, "vs")) then
        inRace = true
        playerPoints = 1000
    elseif string.find(lowerMsg, "won") or string.find(lowerMsg, "lost") or string.find(lowerMsg, "ended") or string.find(lowerMsg, "cancelled") then
        inRace = false
    end

    local pts = string.match(lowerMsg, "(%d+)%s*pts") or string.match(lowerMsg, "points:%s*(%d+)")
    if pts then
        playerPoints = tonumber(pts)
    end
end)

local function findNearestCar()
    local minDist = 99999
    local nearestIdx = -1
    local totalCars = ac.getSim().carsCount

    for i = 1, totalCars - 1 do
        local car = ac.getCar(i)
        if car and car.isConnected and not car.isAIControlled then
            local dist = playerCar.position:distance(car.position)
            if dist < minDist then
                minDist = dist
                nearestIdx = i
            end
        end
    end
    return nearestIdx, minDist
end

function script.drawUI()
    local screenSize = ac.getUI().windowSize
    local targetIdx, distance = findNearestCar()

    local boxWidth = 300
    local boxHeight = inRace and 105 or 75
    local posX = (screenSize.x - boxWidth) / 2
    local posY = 40

    ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + boxHeight), rgbm(0.08, 0.08, 0.1, 0.85), 8)
    ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + boxHeight), rgbm(1, 0.3, 0.1, 0.8), 8, 2)

    ui.setCursor(vec2(posX + 15, posY + 10))
    if targetIdx ~= -1 and distance <= 1000 then
        local driverName = ac.getDriverName(targetIdx)
        local statusText = inRace and "ДУЭЛЬ: " or "Рядом: "
        ui.textColored(statusText .. driverName, rgbm(1, 0.8, 0.2, 1))

        ui.setCursor(vec2(posX + 15, posY + 32))
        ui.text(string.format("Дистанция: %.1f м", distance))
    else
        ui.textColored("Нет игроков рядом (до 1000 м)", rgbm(0.7, 0.7, 0.7, 1))
        ui.setCursor(vec2(posX + 15, posY + 32))
        ui.text(debugText)
    end

    if inRace then
        ui.setCursor(vec2(posX + 15, posY + 55))
        ui.text(string.format("Очки: %d", playerPoints))
        
        local barWidth = boxWidth - 30
        local fillRatio = math.max(0, math.min(1, playerPoints / 1000))
        ui.drawRectFilled(vec2(posX + 15, posY + 78), vec2(posX + 15 + barWidth, posY + 86), rgbm(0.3, 0.3, 0.3, 1), 3)
        ui.drawRectFilled(vec2(posX + 15, posY + 78), vec2(posX + 15 + (barWidth * fillRatio), posY + 86), rgbm(0.2, 0.8, 0.3, 1), 3)
    end
end
