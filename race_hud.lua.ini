local playerCar = ac.getCar(0)
local opponentIndex = -1
local playerPoints = 1000
local opponentPoints = 1000
local inRace = false

-- Перехват сообщений чата для отслеживания гонки и очков
ac.onChatMessage(function(message, senderCarIndex, senderSessionId)
    -- Проверяем, что сообщение от сервера (senderCarIndex == -1)
    if senderCarIndex == -1 then
        local lowerMsg = string.lower(message)
        
        -- Начало или завершение гонки
        if string.find(lowerMsg, "challenge started") or string.find(lowerMsg, "race started") then
            inRace = true
            playerPoints = 1000
            opponentPoints = 1000
        elseif string.find(lowerMsg, "won the") or string.find(lowerMsg, "challenge ended") or string.find(lowerMsg, "cancelled") then
            inRace = false
            opponentIndex = -1
        end

        -- Попытка считать очки из сообщений вида "Points: 850"
        local pts = string.match(lowerMsg, "points:%s*(%d+)")
        if pts then
            playerPoints = tonumber(pts)
        end
    end
end)

-- Поиск ближайшей машины соперника на трассе
local function findNearestCar()
    local minDist = 99999
    local nearestIdx = -1
    local totalCars = ac.getSim().carsCount

    for i = 1, totalCars - 1 do
        local car = ac.getCar(i)
        if car and car.isConnected and not car.isAIControlled then
            local dist = playerCar.position:distance(car.position)
            if dist < minDist then
                minDist = dist
                nearestIdx = i
            end
        end
    end
    return nearestIdx, minDist
end

-- Отрисовка интерфейса на экране (HUD)
function script.drawUI()
    local targetIdx, distance = findNearestCar()
    if targetIdx == -1 or distance > 1000 then return end

    local targetCar = ac.getCar(targetIdx)
    local driverName = ac.getDriverName(targetIdx)
    local screenSize = ac.getUI().windowSize

    -- Координаты окна (верхний центр экрана)
    local boxWidth = 280
    local boxHeight = inRace and 95 or 65
    local posX = (screenSize.x - boxWidth) / 2
    local posY = 40

    -- Полупрозрачный темный фон
    ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + boxHeight), rgbm(0.08, 0.08, 0.1, 0.85), 8)
    ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + boxHeight), rgbm(1, 0.3, 0.1, 0.8), 8, 2)

    -- Текст статуса и имени соперника
    ui.setCursor(vec2(posX + 15, posY + 10))
    local statusText = inRace and "ДУЭЛЬ: " or "Ближайший игрок: "
    ui.textColored(statusText .. driverName, rgbm(1, 0.8, 0.2, 1))

    -- Отображение дистанции в метрах
    ui.setCursor(vec2(posX + 15, posY + 32))
    ui.text(string.format("Дистанция: %.1f м", distance))

    -- Шкала очков (появляется во время активной гонки)
    if inRace then
        ui.setCursor(vec2(posX + 15, posY + 55))
        ui.text(string.format("Ваши очки: %d", playerPoints))
        
        -- Полоса прогресса очков
        local barWidth = boxWidth - 30
        local fillRatio = math.max(0, math.min(1, playerPoints / 1000))
        ui.drawRectFilled(vec2(posX + 15, posY + 76), vec2(posX + 15 + barWidth, posY + 84), rgbm(0.3, 0.3, 0.3, 1), 3)
        ui.drawRectFilled(vec2(posX + 15, posY + 76), vec2(posX + 15 + (barWidth * fillRatio), posY + 84), rgbm(0.2, 0.8, 0.3, 1), 3)
    end
