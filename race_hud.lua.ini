local playerCar = ac.getCar(0)
local inRace = false
local isPreparing = false
local opponentIdx = -1

-- Настройки из extra_cfg (RaceChallengeConfiguration)
local minSpeedKmh = 60.0
local challengeDistance = 150.0
local maxDistance = 600.0
local startingPoints = 10000.0
local pointsLostPerMeter = 1.0

-- Состояние очков SP и таймера
local playerSP = startingPoints
local rivalSP = startingPoints
local raceElapsedTime = 0.0

-- Уведомления и итоги
local resultTimer = 0
local resultText = ""
local resultColor = rgbm(1, 0.85, 0.2, 1)

local overtakeTimer = 0
local overtakeText = ""
local overtakeColor = rgbm(1, 1, 1, 1)

-- Оптимизация поиска игроков (кэш на 0.5 сек)
local searchTimer = 0
local cachedNearestIdx = -1
local cachedNearestDist = 99999

local function isTrafficCar(carIndex)
    local name = ac.getDriverName(carIndex)
    if not name then return true end
    return string.find(string.lower(name), "traffic") ~= nil
end

local function findNearestPlayer()
    local minDist = 99999
    local nearestIdx = -1
    local totalCars = ac.getSim().carsCount

    for i = 1, totalCars - 1 do
        local car = ac.getCar(i)
        if car and car.isConnected and not isTrafficCar(i) then
            local dist = playerCar.position:distance(car.position)
            if dist < minDist then
                minDist = dist
                nearestIdx = i
            end
        end
    end
    return nearestIdx, minDist
end

local function finishDuel(text, color)
    inRace = false
    isPreparing = false
    resultText = text
    resultColor = color
    resultTimer = 5.0
    opponentIdx = -1
    overtakeTimer = 0
end

-- Обработка сообщений чата RaceChallengePlugin
local function handleServerMessage(message)
    if not message or message == "" then return end
    local lowerMsg = string.lower(message)

    -- 1. Обратный отсчет
    if string.find(lowerMsg, "ready...") or string.find(lowerMsg, "set...") then
        local targetIdx, dist = findNearestPlayer()
        if targetIdx ~= -1 and dist <= challengeDistance then
            isPreparing = true
            opponentIdx = targetIdx
            resultTimer = 0
        end
        return
    end

    -- 2. Старт гонки (Go!)
    if lowerMsg == "go!" or string.find(lowerMsg, "go!") then
        local targetIdx, dist = findNearestPlayer()
        if targetIdx ~= -1 and dist <= challengeDistance then
            isPreparing = false
            inRace = true
            opponentIdx = targetIdx
            playerSP = startingPoints
            rivalSP = startingPoints
            raceElapsedTime = 0.0
            resultTimer = 0
            overtakeTimer = 0
        end
        return
    end

    -- 3. Событие обгона
    if inRace and string.find(lowerMsg, "has overtaken") then
        local myName = string.lower(ac.getDriverName(0) or "")
        local oppName = opponentIdx ~= -1 and string.lower(ac.getDriverName(opponentIdx) or "") or ""
        local overtakenPos = string.find(lowerMsg, "has overtaken")

        if myName ~= "" and oppName ~= "" and overtakenPos then
            local myPos = string.find(lowerMsg, myName, 1, true)
            local oppPos = string.find(lowerMsg, oppName, 1, true)

            if myPos and oppPos then
                if myPos < overtakenPos then
                    overtakeText = "ВЫ ОБОГНАЛИ СОПЕРНИКА!"
                    overtakeColor = rgbm(1.0, 0.65, 0.35, 1)
                    overtakeTimer = 3.0
                elseif oppPos < overtakenPos then
                    overtakeText = "ВАС ОБОГНАЛИ!"
                    overtakeColor = rgbm(1.0, 0.25, 0.2, 1)
                    overtakeTimer = 3.0
                end
            end
        end
        return
    end

    -- 4. Завершение гонки серверным плагином
    if inRace and string.find(lowerMsg, "in a race") and (string.find(lowerMsg, "just been") or string.find(lowerMsg, "just beat")) then
        local myName = string.lower(ac.getDriverName(0) or "")
        local oppName = opponentIdx ~= -1 and string.lower(ac.getDriverName(opponentIdx) or "") or ""

        if (myName ~= "" and string.find(lowerMsg, myName, 1, true)) or (oppName ~= "" and string.find(lowerMsg, oppName, 1, true)) then
            if playerSP > rivalSP then
                finishDuel("SP BATTLE: ПОБЕДА!", rgbm(1.0, 0.65, 0.35, 1))
            elseif playerSP < rivalSP then
                finishDuel("SP BATTLE: ПОРАЖЕНИЕ", rgbm(1.0, 0.25, 0.2, 1))
            else
                finishDuel("SP BATTLE: НИЧЬЯ", rgbm(1.0, 0.85, 0.2, 1))
            end
        end
    end
end

ac.onChatMessage(function(message, senderCarIndex, senderSessionId)
    handleServerMessage(message)
end)

if ac.onSystemMessage then
    ac.onSystemMessage(function(message)
        handleServerMessage(message)
    end)
end

-- Основной цикл расчетов
function script.update(dt)
    if resultTimer > 0 then resultTimer = resultTimer - dt end
    if overtakeTimer > 0 then overtakeTimer = overtakeTimer - dt end

    searchTimer = searchTimer - dt
    if searchTimer <= 0 then
        searchTimer = 0.5
        cachedNearestIdx, cachedNearestDist = findNearestPlayer()
    end

    if not inRace then return end

    raceElapsedTime = raceElapsedTime + dt

    local oppCar = ac.getCar(opponentIdx)
    if not oppCar or not oppCar.isConnected then
        finishDuel("ДУЭЛЬ ПРЕРВАНА (СОПЕРНИК ВЫШЕЛ)", rgbm(0.8, 0.8, 0.8, 1))
        return
    end

    local distance = playerCar.position:distance(oppCar.position)

    if distance > maxDistance then
        finishDuel("ДУЭЛЬ ПРЕРВАНА (РАЗРЫВ > 600 М)", rgbm(0.8, 0.8, 0.8, 1))
        return
    end

    local toOpponent = oppCar.position - playerCar.position
    local forwardDot = playerCar.look:dot(toOpponent)
    local loss = distance * pointsLostPerMeter * dt

    if forwardDot < 0 then
        rivalSP = math.max(0, rivalSP - loss)
    elseif forwardDot > 0 then
        playerSP = math.max(0, playerSP - loss)
    end

    if rivalSP <= 0 then
        finishDuel("SP BATTLE: ПОБЕДА!", rgbm(1.0, 0.65, 0.35, 1))
    elseif playerSP <= 0 then
        finishDuel("SP BATTLE: ПОРАЖЕНИЕ", rgbm(1.0, 0.25, 0.2, 1))
    end
end
local function drawTXRCircleBadge(center, radius, topText)
    ui.drawCircleFilled(center, radius, rgbm(0.05, 0.05, 0.07, 0.92), 36)
    ui.drawCircle(center, radius, rgbm(1, 1, 1, 0.95), 36, 2.5)
    ui.drawCircle(center, radius - 4, rgbm(1, 1, 1, 0.35), 36, 1.0)
    local textSize = ui.measureText(topText)
    ui.setCursor(vec2(center.x - textSize.x * 0.5, center.y - textSize.y * 0.5))
    ui.textColored(topText, rgbm(1, 1, 1, 1))
end

function script.drawUI()
    local screenSize = ac.getUI().windowSize
    local centerX = screenSize.x * 0.5
    local topY = 26

    -- 1. Баннер результата финиша
    if resultTimer > 0 then
        local boxW = 480
        local boxH = 54
        local x1 = centerX - boxW * 0.5
        ui.drawRectFilled(vec2(x1, topY), vec2(x1 + boxW, topY + boxH), rgbm(0.05, 0.05, 0.07, 0.92), 2)
        ui.drawRect(vec2(x1, topY), vec2(x1 + boxW, topY + boxH), resultColor, 2, 2)
        local tSize = ui.measureText(resultText)
        ui.setCursor(vec2(centerX - tSize.x * 0.5, topY + (boxH - tSize.y) * 0.5))
        ui.textColored(resultText, resultColor)
        return
    end

    -- 2. Активная дуэль (Оригинальный стиль TXR)
    if inRace and opponentIdx ~= -1 then
        local barWidth = math.min(420, screenSize.x * 0.33)
        local barHeight = 16
        local spGap = 46
        local barY = topY + 26
        local circleRadius = 27
        local circleCenterY = barY + barHeight * 0.5

        -- Таймер 00'00"000 сверху по центру
        local mins = math.floor(raceElapsedTime / 60)
        local secs = math.floor(raceElapsedTime % 60)
        local millis = math.floor((raceElapsedTime * 1000) % 1000)
        local timerStr = string.format("%02d'%02d\"%03d", mins, secs, millis)
        local timerSize = ui.measureText(timerStr)
        ui.setCursor(vec2(centerX - timerSize.x * 0.5, topY + 2))
        ui.textColored(timerStr, rgbm(1, 1, 1, 0.95))

        -- Центральный текст "SP"
        local spSize = ui.measureText("SP")
        ui.setCursor(vec2(centerX - spSize.x * 0.5, circleCenterY - spSize.y * 0.5))
        ui.textColored("SP", rgbm(1, 1, 1, 1))

        -- === ЛЕВАЯ ШКАЛА (ИГРОК - YOU) ===
        local leftBarRight = centerX - spGap * 0.5
        local leftBarLeft = leftBarRight - barWidth

        ui.drawRectFilled(vec2(leftBarLeft, barY), vec2(leftBarRight, barY + barHeight), rgbm(0.06, 0.06, 0.08, 0.85))
        ui.drawRect(vec2(leftBarLeft, barY), vec2(leftBarRight, barY + barHeight), rgbm(1, 1, 1, 0.9), 0, 1.5)

        local playerRatio = math.max(0.0, math.min(1.0, playerSP / startingPoints))
        if playerRatio > 0 then
            local fillStart = leftBarRight - (barWidth * playerRatio)
            local c1 = rgbm(0.95, 0.52, 0.32, 1)
            local c2 = rgbm(0.98, 0.65, 0.45, 1)
            ui.drawRectFilledMultiColor(vec2(fillStart + 1.5, barY + 1.5), vec2(leftBarRight - 1.5, barY + barHeight - 1.5), c1, c2, c2, c1)

            if playerRatio < 0.995 then
                ui.drawLine(vec2(fillStart, barY - 6), vec2(fillStart, barY + barHeight + 6), rgbm(1.0, 0.85, 0.7, 0.95), 2)
            end
        end

        local leftCircleX = leftBarLeft - circleRadius - 8
        drawTXRCircleBadge(vec2(leftCircleX, circleCenterY), circleRadius, "YOU")

        -- Название твоей машины под левой шкалой
        local myCarName = ac.getCarName(0) or "Unknown Car"
        ui.setCursor(vec2(leftBarLeft, barY + barHeight + 6))
        ui.textColored(myCarName, rgbm(1, 1, 1, 0.95))

        -- === ПРАВАЯ ШКАЛА (СОПЕРНИК - RIVAL) ===
        local rightBarLeft = centerX + spGap * 0.5
        local rightBarRight = rightBarLeft + barWidth

        ui.drawRectFilled(vec2(rightBarLeft, barY), vec2(rightBarRight, barY + barHeight), rgbm(0.06, 0.06, 0.08, 0.85))
        ui.drawRect(vec2(rightBarLeft, barY), vec2(rightBarRight, barY + barHeight), rgbm(1, 1, 1, 0.9), 0, 1.5)

        local rivalRatio = math.max(0.0, math.min(1.0, rivalSP / startingPoints))
        if rivalRatio > 0 then
            local fillEnd = rightBarLeft + (barWidth * rivalRatio)
            local c1 = rgbm(0.98, 0.65, 0.45, 1)
            local c2 = rgbm(0.95, 0.52, 0.32, 1)
            ui.drawRectFilledMultiColor(vec2(rightBarLeft + 1.5, barY + 1.5), vec2(fillEnd - 1.5, barY + barHeight - 1.5), c1, c2, c2, c1)

            if rivalRatio < 0.995 then
                ui.drawLine(vec2(fillEnd, barY - 6), vec2(fillEnd, barY + barHeight + 6), rgbm(1.0, 0.85, 0.7, 0.95), 2)
            end
        end

        local rightCircleX = rightBarRight + circleRadius + 8
        drawTXRCircleBadge(vec2(rightCircleX, circleCenterY), circleRadius, "RIVAL")

        -- Ник и машина соперника под правой шкалой (выровнено по правому краю)
        local oppName = ac.getDriverName(opponentIdx) or "Rival"
        local oppCarName = ac.getCarName(opponentIdx) or "Unknown Car"
        local rivalLabel = oppName .. "  |  " .. oppCarName
        local rivalLabelSize = ui.measureText(rivalLabel)
        ui.setCursor(vec2(rightBarRight - rivalLabelSize.x, barY + barHeight + 6))
        ui.textColored(rivalLabel, rgbm(1, 1, 1, 0.95))

        -- Баннер при обгоне
        if overtakeTimer > 0 then
            local bannerW = 320
            local bannerH = 26
            local bannerY = barY + barHeight + 32
            local bx1 = centerX - bannerW * 0.5
            ui.drawRectFilled(vec2(bx1, bannerY), vec2(bx1 + bannerW, bannerY + bannerH), rgbm(0.05, 0.05, 0.07, 0.9), 2)
            ui.drawRect(vec2(bx1, bannerY), vec2(bx1 + bannerW, bannerY + bannerH), overtakeColor, 2, 1.5)
            local ovSize = ui.measureText(overtakeText)
            ui.setCursor(vec2(centerX - ovSize.x * 0.5, bannerY + (bannerH - ovSize.y) * 0.5))
            ui.textColored(overtakeText, overtakeColor)
        end
        return
    end

    -- 3. Компактный режим ожидания
    if isPreparing and opponentIdx ~= -1 then
        local oppName = ac.getDriverName(opponentIdx) or "RIVAL"
        local boxW = 440
        local boxH = 50
        local x1 = centerX - boxW * 0.5
        ui.drawRectFilled(vec2(x1, topY), vec2(x1 + boxW, topY + boxH), rgbm(0.05, 0.05, 0.07, 0.88), 2)
        ui.drawRect(vec2(x1, topY), vec2(x1 + boxW, topY + boxH), rgbm(1.0, 0.65, 0.35, 0.95), 2, 1.5)

        local line1 = "SP BATTLE: ПРИГОТОВЬТЕСЬ! RIVAL: " .. oppName
        local line2 = "Ожидание сигнала GO!"
        ui.setCursor(vec2(centerX - ui.measureText(line1).x * 0.5, topY + 7))
        ui.textColored(line1, rgbm(1.0, 0.75, 0.4, 1))
        ui.setCursor(vec2(centerX - ui.measureText(line2).x * 0.5, topY + 26))
        ui.textColored(line2, rgbm(0.9, 0.9, 0.9, 0.9))
    elseif cachedNearestIdx ~= -1 and cachedNearestDist <= challengeDistance then
        local driverName = ac.getDriverName(cachedNearestIdx) or "RIVAL"
        local currentSpeed = playerCar.speedKmh or 0
        local boxW = 460
        local boxH = 50
        local x1 = centerX - boxW * 0.5

        ui.drawRectFilled(vec2(x1, topY), vec2(x1 + boxW, topY + boxH), rgbm(0.05, 0.05, 0.07, 0.85), 2)
        ui.drawRect(vec2(x1, topY), vec2(x1 + boxW, topY + boxH), rgbm(1, 1, 1, 0.6), 2, 1)

        local line1 = string.format("RIVAL РЯДОМ: %s (%.0f м)", driverName, cachedNearestDist)
        local line2 = currentSpeed < minSpeedKmh
            and string.format("Разгонитесь выше %d км/ч для вызова", minSpeedKmh)
            or "Моргните дальним светом для начала дуэли"

        ui.setCursor(vec2(centerX - ui.measureText(line1).x * 0.5, topY + 7))
        ui.textColored(line1, rgbm(1.0, 0.65, 0.4, 1))
        ui.setCursor(vec2(centerX - ui.measureText(line2).x * 0.5, topY + 26))
        ui.textColored(line2, rgbm(0.95, 0.95, 0.95, 0.95))
    end
end
