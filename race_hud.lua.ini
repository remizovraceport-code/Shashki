local playerCar = ac.getCar(0)
local inRace = false
local isPreparing = false
local opponentIdx = -1
local raceScore = 0 -- От -1000 (проигрыш) до +1000 (победа)
local maxScore = 1000
local resultTimer = 0
local resultText = ""

-- Проверка, является ли машина трафиком
local function isTrafficCar(carIndex)
    local name = ac.getDriverName(carIndex)
    if not name then return true end
    return string.find(string.lower(name), "traffic") ~= nil
end

-- Поиск ближайшего реального игрока (без трафика)
local function findNearestPlayer()
    local minDist = 99999
    local nearestIdx = -1
    local totalCars = ac.getSim().carsCount

    for i = 1, totalCars - 1 do
        local car = ac.getCar(i)
        if car and car.isConnected and not isTrafficCar(i) then
            local dist = playerCar.position:distance(car.position)
            if dist < minDist then
                minDist = dist
                nearestIdx = i
            end
        end
    end
    return nearestIdx, minDist
end

-- Обработка точных фраз из чата RaceChallengePlugin
local function handleServerMessage(message)
    if not message or message == "" then return end
    local lowerMsg = string.lower(message)

    -- 1. Обратный отсчет перед стартом
    if string.find(lowerMsg, "ready...") or string.find(lowerMsg, "set...") then
        local targetIdx, dist = findNearestPlayer()
        if targetIdx ~= -1 and dist <= 400 then
            isPreparing = true
            opponentIdx = targetIdx
            resultTimer = 0
        end
        return
    end

    -- 2. Старт гонки по команде Go!
    if lowerMsg == "go!" or string.find(lowerMsg, "go!") then
        local targetIdx, dist = findNearestPlayer()
        if targetIdx ~= -1 and dist <= 400 then
            isPreparing = false
            inRace = true
            opponentIdx = targetIdx
            raceScore = 0
            resultTimer = 0
        end
        return
    end

    -- 3. Завершение гонки плагином ("... just been ... in a race" или "... just beat ... in a race")
    if inRace and string.find(lowerMsg, "in a race") and (string.find(lowerMsg, "just been") or string.find(lowerMsg, "just beat")) then
        local myName = string.lower(ac.getDriverName(0) or "")
        local oppName = opponentIdx ~= -1 and string.lower(ac.getDriverName(opponentIdx) or "") or ""

        -- Проверяем, что сообщение относится именно к нашей дуэли, а не к чужой на сервере
        if (myName ~= "" and string.find(lowerMsg, myName, 1, true)) or (oppName ~= "" and string.find(lowerMsg, oppName, 1, true)) then
            inRace = false
            isPreparing = false
            resultText = raceScore >= 0 and "ПОБЕДА В ДУЭЛИ!" or "ПОРАЖЕНИЕ В ДУЭЛИ"
            resultTimer = 5.0
            opponentIdx = -1
        end
    end
end

-- Подписываемся на чат и системные уведомления CSP
ac.onChatMessage(function(message, senderCarIndex, senderSessionId)
    handleServerMessage(message)
end)

if ac.onSystemMessage then
    ac.onSystemMessage(function(message)
        handleServerMessage(message)
    end)
end

-- Расчет очков (2-3 минуты при полном лидерстве)
function script.update(dt)
    if resultTimer > 0 then
        resultTimer = resultTimer - dt
    end

    if not inRace then return end

    local oppCar = ac.getCar(opponentIdx)
    if not oppCar or not oppCar.isConnected then
        inRace = false
        opponentIdx = -1
        return
    end

    local distance = playerCar.position:distance(oppCar.position)

    -- Если разъехались дальше 600 м — отмена
    if distance > 600 then
        inRace = false
        resultText = "ДУЭЛЬ ПРЕРВАНА (БОЛЬШОЙ ОТРЫВ)"
        resultTimer = 4.0
        opponentIdx = -1
        return
    end

    -- Кто впереди по направлению движения
    local toOpponent = oppCar.position - playerCar.position
    local forwardDot = playerCar.look:dot(toOpponent)
    
    -- 5..8 очков в секунду (при 1000 очках заезд длится ~2-3 минуты)
    local distBonus = math.min(3.0, (distance / 50.0) * 3.0)
    local pointsPerSec = 5.0 + distBonus

    if forwardDot < 0 then
        raceScore = raceScore + (pointsPerSec * dt)
    else
        raceScore = raceScore - (pointsPerSec * dt)
    end

    -- Финиш по достижению максимума нашей шкалы
    if raceScore >= maxScore then
        inRace = false
        resultText = "ПОБЕДА В ДУЭЛИ!"
        resultTimer = 5.0
        opponentIdx = -1
    elseif raceScore <= -maxScore then
        inRace = false
        resultText = "ПОРАЖЕНИЕ В ДУЭЛИ"
        resultTimer = 5.0
        opponentIdx = -1
    end
end

-- Отрисовка чистого HUD (виден всегда)
function script.drawUI()
    local screenSize = ac.getUI().windowSize
    local boxWidth = 340
    local posX = (screenSize.x - boxWidth) / 2
    local posY = 35

    -- 1. Баннер результата после финиша
    if resultTimer > 0 then
        ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + 50), rgbm(0.08, 0.08, 0.1, 0.9), 8)
        ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + 50), rgbm(1, 0.8, 0.1, 0.9), 8, 2)
        ui.setCursor(vec2(posX + 20, posY + 15))
        ui.textColored(resultText, rgbm(1, 0.85, 0.2, 1))
        return
    end

    -- 2. Активная дуэль
    if inRace and opponentIdx ~= -1 then
        local oppCar = ac.getCar(opponentIdx)
        local oppName = ac.getDriverName(opponentIdx)
        local distance = playerCar.position:distance(oppCar.position)
        local isLeading = raceScore >= 0

        ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + 100), rgbm(0.06, 0.06, 0.09, 0.88), 8)
        ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + 100), isLeading and rgbm(0.2, 0.85, 0.4, 0.9) or rgbm(0.9, 0.25, 0.25, 0.9), 8, 2)

        ui.setCursor(vec2(posX + 15, posY + 10))
        ui.textColored("ДУЭЛЬ VS " .. oppName, rgbm(1, 0.85, 0.2, 1))

        ui.setCursor(vec2(posX + 15, posY + 32))
        ui.text(string.format("Дистанция: %.1f м", distance))

        ui.setCursor(vec2(posX + 185, posY + 32))
        local scoreSign = raceScore > 0 and "+" or ""
        ui.textColored(string.format("Очки: %s%d / %d", scoreSign, math.floor(raceScore), maxScore), isLeading and rgbm(0.3, 1, 0.5, 1) or rgbm(1, 0.4, 0.4, 1))

        -- Двухсторонняя шкала (центр = 0)
        local barX = posX + 15
        local barY = posY + 62
        local barW = boxWidth - 30
        local barH = 14
        local centerX = barX + (barW / 2)

        ui.drawRectFilled(vec2(barX, barY), vec2(barX + barW, barY + barH), rgbm(0.2, 0.2, 0.25, 1), 4)

        local ratio = math.max(-1, math.min(1, raceScore / maxScore))
        if ratio > 0 then
            ui.drawRectFilled(vec2(centerX, barY), vec2(centerX + (barW / 2) * ratio, barY + barH), rgbm(0.2, 0.85, 0.4, 1), 2)
        elseif ratio < 0 then
            ui.drawRectFilled(vec2(centerX + (barW / 2) * ratio, barY), vec2(centerX, barY + barH), rgbm(0.9, 0.25, 0.25, 1), 2)
        end

        ui.drawLine(vec2(centerX, barY - 3), vec2(centerX, barY + barH + 3), rgbm(1, 1, 1, 0.9), 2)
        return
    end

    -- 3. Режим ожидания или отсчета перед стартом
    local targetIdx, distance = findNearestPlayer()
    ui.drawRectFilled(vec2(posX, posY), vec2(posX + boxWidth, posY + 60), rgbm(0.08, 0.08, 0.1, 0.8), 8)
    ui.drawRect(vec2(posX, posY), vec2(posX + boxWidth, posY + 60), isPreparing and rgbm(1, 0.8, 0.1, 0.9) or rgbm(0.4, 0.4, 0.45, 0.6), 8, isPreparing and 2 or 1)

    if isPreparing and opponentIdx ~= -1 then
        local oppName = ac.getDriverName(opponentIdx)
        ui.setCursor(vec2(posX + 15, posY + 10))
        ui.textColored("ПРИГОТОВЬТЕСЬ! Соперник: " .. oppName, rgbm(1, 0.85, 0.2, 1))
        ui.setCursor(vec2(posX + 15, posY + 32))
        ui.text("Ожидание сигнала GO!...")
    elseif targetIdx ~= -1 and distance <= 500 then
        local driverName = ac.getDriverName(targetIdx)
        ui.setCursor(vec2(posX + 15, posY + 10))
        ui.textColored("Игрок рядом: " .. driverName, rgbm(0.9, 0.9, 0.9, 1))
        ui.setCursor(vec2(posX + 15, posY + 32))
        ui.text(string.format("Дистанция: %.1f м (моргните 3 раза для старта)", distance))
    else
        ui.setCursor(vec2(posX + 15, posY + 10))
        ui.textColored("Режим дуэли: Ожидание соперника", rgbm(0.75, 0.75, 0.8, 1))
        ui.setCursor(vec2(posX + 15, posY + 32))
        ui.text(targetIdx ~= -1 and string.format("Ближайший игрок: %.0f м", distance) or "Других игроков на трассе нет")
    end
end
